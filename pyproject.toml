[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-forecasting"
version = "0.1.0"
description = "Leak-free PM2.5 and PM10 forecasting benchmark with cross-pollutant models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "PyYAML>=6.0",
  "matplotlib>=3.9",
  "torch>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
boosting = ["lightgbm>=4.5"]

[project.scripts]
pm-forecast = "pm_forecasting.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

